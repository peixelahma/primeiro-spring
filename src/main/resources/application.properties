spring.application.name=primeiro-spring

# URL de conexão do banco H2 em memória
spring.datasource.url=jdbc:h2:file:./src/resources/meubanco/produtosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Atualização automática do esquema pelo Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilitar o Console Web do H2 (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console